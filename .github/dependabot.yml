version: 2
updates:
  # uv, not pip: uv.lock is what CI installs (uv sync --frozen). The pip
  # ecosystem only ever proposed pyproject range bumps, all closed unmerged.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    groups:
      # Majors stay out of the group so they arrive as their own PR and are
      # never swept into an auto-merge (see the automerge job in ci.yml).
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    groups:
      docker:
        patterns: ["*"]
