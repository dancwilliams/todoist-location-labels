[project]
name = "todoist-location-labels"
version = "0.1.0"
description = "Todoist service for adding location reminders by label assignment"
requires-python = ">=3.13"
dependencies = [
    "psycopg2-binary",
    "gunicorn",
    "requests",
    "Flask",
    "Flask-SQLAlchemy",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "types-requests",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing"
