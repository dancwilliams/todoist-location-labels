[project]
name = "todoist-location-labels"
version = "0.1.0"
description = "Todoist service for adding location reminders by label assignment"
requires-python = ">=3.13"
dependencies = [
    "psycopg2-binary",
    "gunicorn",
    "requests",
    "Flask",
    "Flask-SQLAlchemy",
    "Flask-Session",
    "Flask-Limiter",
    "tenacity",
    "opentelemetry-api>=1.41.0",
    "opentelemetry-sdk>=1.41.0",
    "opentelemetry-exporter-otlp>=1.41.0",
    "opentelemetry-instrumentation>=0.62b0",
    "opentelemetry-instrumentation-dbapi>=0.62b0",
    "opentelemetry-instrumentation-logging>=0.62b0",
    "opentelemetry-instrumentation-urllib>=0.62b0",
    "opentelemetry-instrumentation-wsgi>=0.62b0",
    "opentelemetry-instrumentation-jinja2>=0.62b0",
    "opentelemetry-instrumentation-requests>=0.62b0",
    "opentelemetry-instrumentation-urllib3>=0.62b0",
    "opentelemetry-instrumentation-flask>=0.62b0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "types-requests",
]

[tool.uv]
prerelease = "allow"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing"

[tool.ruff.lint.isort]
known-third-party = ["flask_session"]  # a runtime flask_session/ cache dir must not flip the sort
