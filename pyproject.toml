[project]
name = "todoist-location-labels"
version = "0.1.0"
description = "Todoist service for adding location reminders by label assignment"
requires-python = ">=3.13"
dependencies = [
    "psycopg2-binary",
    "gunicorn",
    "requests",
    "Flask",
    "Flask-SQLAlchemy",
    "Flask-Session",
    "Flask-Limiter",
    "tenacity",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp>=1.30",
    "opentelemetry-instrumentation>=0.61b0",
    "opentelemetry-instrumentation-dbapi>=0.61b0",
    "opentelemetry-instrumentation-logging>=0.61b0",
    "opentelemetry-instrumentation-urllib>=0.61b0",
    "opentelemetry-instrumentation-wsgi>=0.61b0",
    "opentelemetry-instrumentation-jinja2>=0.61b0",
    "opentelemetry-instrumentation-requests>=0.61b0",
    "opentelemetry-instrumentation-urllib3>=0.61b0",
    "opentelemetry-instrumentation-flask>=0.61b0",
]

[dependency-groups]
dev = [
    "ruff",
]

[tool.uv]
prerelease = "allow"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.format]
quote-style = "double"
